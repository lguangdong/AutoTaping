name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore AutoTaping.sln -s https://api.nuget.org/v3/index.json

      - name: Publish
        run: dotnet publish src/AutoTaping.App -c Release -r win-x64 --self-contained true -o publish --no-restore

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath AutoTaping-win-x64.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: AutoTaping-win-x64.zip
          generate_release_notes: true
